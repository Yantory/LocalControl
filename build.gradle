
plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.16.1'
}

group = 'ru.localcontrol'
version = '1.0.0'

base {
    archivesName = 'LocalControl'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        url = 'https://maven.quiltmc.org/repository/release'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

loom {
    mixin {
        // Для Minecraft 26.1+ используем обработку Loom,
        // а не старый Mixin Annotation Processor.
        useLegacyMixinAp = false
    }

    runs {
        client {
            client()
            ideConfigGenerated(true)
            runDir('run')
            setConfigName('LocalControl Client')
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'

    implementation 'org.quiltmc:quilt-loader:0.30.2'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'

    // Только для компиляции Mixin-классов.
    compileOnly 'net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7'

    implementation 'com.google.code.gson:gson:2.11.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-parameters']
}
